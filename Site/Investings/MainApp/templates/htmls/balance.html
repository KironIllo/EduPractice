{% extends 'htmls/main.html' %}

{% block content %}
<div class="balance-container">
    <h2>Ваш баланс</h2>
    <div class="balance-amount">
        <strong>{{ balance|floatformat:2 }} руб.</strong>
    </div>

    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label class="form-label">Пополнить на:</label>
            <div class="amount-options">
                <label><input type="radio" name="income" value="100" required> 100 руб.</label>
                <label><input type="radio" name="income" value="500"> 500 руб.</label>
                <label><input type="radio" name="income" value="1000"> 1000 руб.</label>
                <label><input type="radio" name="income" value="5000"> 5000 руб.</label>
                <label><input type="radio" name="income" value="10000"> 10000 руб.</label>
            </div>
        </div>
        <button type="submit" class="btn btn-outline-success">Пополнить</button>
        <a href="/" class="btn btn-cancel">Отмена</a>
    </form>
</div>
{% endblock %}
